version: "3.9"

services:
  # ─────────────────────────── Database ────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dms_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────── MinIO ────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: dms_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - dms_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ─────────────────────────── Redis ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dms_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - dms_network

  # ─────────────────────────── Backend ──────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dms_backend
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - SINDAS_ENABLED=${SINDAS_ENABLED:-true}
      - SINDAS_API_BASE_URL=${SINDAS_API_BASE_URL}
      - SINDAS_API_KEY=${SINDAS_API_KEY}
      - SINDAS_WEBHOOK_SECRET=${SINDAS_WEBHOOK_SECRET:-change-me}
      - SINDAS_DEFAULT_SEKOLAH_ID=${SINDAS_DEFAULT_SEKOLAH_ID:-1}
    volumes:
      - ./backend:/app
      - ./ml_model:/ml_model
    ports:
      - "8000:8000"
    networks:
      - dms_network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_started
    user: root
    command: sh -c "pip install pyotp qrcode && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"

  # ─────────────────────────── Frontend ─────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: dms_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    networks:
      - dms_network
    depends_on:
      - backend

  # ─────────────────────────── Celery ─────────────────────────────
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dms_celery
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MINIO_ENDPOINT=minio:9000
    volumes:
      - ./backend:/app
      - ./ml_model:/ml_model
    networks:
      - dms_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.core.celery_app worker --loglevel=info

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dms_celery_beat
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MINIO_ENDPOINT=minio:9000
    volumes:
      - ./backend:/app
      - ./ml_model:/ml_model
    networks:
      - dms_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.core.celery_app beat --loglevel=info

  # ─────────────────────────── Nginx ────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: dms_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - dms_network
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  dms_network:
    driver: bridge
